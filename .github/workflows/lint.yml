name: Lint and Format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint and format tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff isort yapf

      - name: Run ruff
        run: |
          TARGETS=(
            main.py
            jrystal/cli.py
            jrystal/config.py
            jrystal/terminal_ui.py
            $(find jrystal/calc -maxdepth 1 -type f -name "*.py" | sort)
            $(find tests/smoke -type f -name "*.py" | sort)
          )
          ruff check "${TARGETS[@]}"

      - name: Run format checks
        run: |
          PYTHON_FILES=(
            main.py
            jrystal/cli.py
            jrystal/config.py
            jrystal/terminal_ui.py
            $(find jrystal/calc -maxdepth 1 -type f -name "*.py" | sort)
            $(find tests/smoke -type f -name "*.py" | sort)
          )
          YAPF_FILES=(
            main.py
            jrystal/cli.py
            jrystal/config.py
            jrystal/terminal_ui.py
            jrystal/calc/__init__.py
            jrystal/calc/backend.py
            jrystal/calc/convergence.py
            jrystal/calc/density_mixing.py
            jrystal/calc/pre_calc.py
            jrystal/calc/solver_nscf.py
            jrystal/calc/types.py
            jrystal/calc/workflow_logging.py
            tests/smoke/test_cli.py
            tests/smoke/test_config.py
            tests/smoke/test_import.py
            tests/smoke/test_ksampling.py
            tests/smoke/test_runtime.py
            tests/smoke/test_terminal_ui.py
          )
          isort --check "${PYTHON_FILES[@]}"
          yapf -r -d "${YAPF_FILES[@]}"
